<ion-header class="app-chrome">
  <ion-toolbar>
    <h1 class="wordmark"><span lang="ja" aria-hidden="true">活用</span> Katsu<span class="wordmark__section">{{'menu.conjugation'|translate}}</span></h1>
    <ion-buttons slot="end">
      <app-menu-button></app-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="patterned" [fullscreen]="true">
  <h2 class="page-heading">{{'setting.title'|translate}}</h2>
  <app-review-settings></app-review-settings>
  <app-credit></app-credit>
</ion-content>

<ion-footer class="app-footer">
  <p class="session-summary">{{ summary }}</p>
  <ion-button
    (click)="startReview()"
    size="large"
    class="start-review"
  >
    {{'home.start'|translate}}
  </ion-button>
</ion-footer>
